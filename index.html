<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Startup Camp Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space+Grotesk', sans-serif; background-color: #f8fafc; }
        .step-panel { display: none; }
        .step-panel.active { display: block; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .chart-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; height: 350px; }
        canvas#drawCanvas { cursor: crosshair; touch-action: none; background: white; width: 100%; height: 100%; }
        .nav-btn.active { background-color: #2563eb; color: white; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <nav class="w-full md:w-72 bg-slate-900 text-white flex flex-col p-6 shadow-2xl z-10">
        <div class="mb-10">
            <h1 class="text-3xl font-bold tracking-tighter text-blue-400">STARTUP<span class="text-white">OS</span></h1>
            <p class="text-xs text-slate-400 uppercase tracking-widest mt-1">AI Camp Edition</p>
        </div>
        <div class="flex-1 space-y-2" id="nav-links">
            <button onclick="showStep(1)" class="nav-btn w-full text-left p-4 rounded-xl active transition-all flex items-center gap-3" id="btn-1">01 The Squad</button>
            <button onclick="showStep(2)" class="nav-btn w-full text-left p-4 rounded-xl hover:bg-slate-800 transition-all flex items-center gap-3" id="btn-2">02 The Big Idea</button>
            <button onclick="showStep(3)" class="nav-btn w-full text-left p-4 rounded-xl hover:bg-slate-800 transition-all flex items-center gap-3" id="btn-3">03 Design Lab</button>
            <button onclick="showStep(4)" class="nav-btn w-full text-left p-4 rounded-xl hover:bg-slate-800 transition-all flex items-center gap-3" id="btn-4">04 Tech Check</button>
            <button onclick="showStep(5)" class="nav-btn w-full text-left p-4 rounded-xl hover:bg-slate-800 transition-all flex items-center gap-3" id="btn-5">05 Final Pitch</button>
        </div>
    </nav>

    <main class="flex-1 overflow-y-auto p-6 md:p-12 bg-slate-50">
        <section id="step-1" class="step-panel active max-w-4xl mx-auto">
            <h2 class="text-5xl font-extrabold text-slate-900 mb-4">The Squad</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
                <input type="text" id="companyName" class="w-full text-2xl font-bold bg-white border-2 border-slate-200 rounded-2xl p-4" placeholder="Company Name">
                <input type="text" id="mission" class="w-full text-lg bg-white border-2 border-slate-200 rounded-2xl p-5" placeholder="The Mission">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="ceo-name" class="p-4 bg-white border rounded-xl" placeholder="CEO Name">
                <input type="text" id="eng-name" class="p-4 bg-white border rounded-xl" placeholder="Engineer Name">
                <input type="text" id="des-name" class="p-4 bg-white border rounded-xl" placeholder="Designer Name">
            </div>
            <button onclick="showStep(2)" class="mt-8 bg-blue-600 text-white px-10 py-4 rounded-2xl font-bold">Next ➔</button>
        </section>

        <section id="step-2" class="step-panel max-w-4xl mx-auto">
            <h2 class="text-5xl font-extrabold text-slate-900 mb-6">The Big Idea</h2>
            <textarea id="problemText" rows="3" class="w-full p-4 border rounded-xl mb-4" placeholder="What is the problem?"></textarea>
            <textarea id="solutionText" rows="3" class="w-full p-4 border rounded-xl" placeholder="How does AI fix it?"></textarea>
            <button onclick="showStep(3)" class="mt-8 bg-blue-600 text-white px-10 py-4 rounded-2xl font-bold">Next ➔</button>
        </section>

        <section id="step-3" class="step-panel max-w-4xl mx-auto">
            <h2 class="text-5xl font-extrabold text-slate-900 mb-6">Design Lab</h2>
            <div class="bg-white p-6 rounded-2xl shadow-xl">
                <div class="flex gap-4 mb-4">
                    <input type="color" id="penColor" value="#2563eb">
                    <button onclick="clearCanvas()" class="text-red-500 font-bold">Clear</button>
                </div>
                <div style="height: 400px; border: 2px dashed #ccc;">
                    <canvas id="drawCanvas"></canvas>
                </div>
            </div>
            <button onclick="showStep(4)" class="mt-8 bg-blue-600 text-white px-10 py-4 rounded-2xl font-bold">Next ➔</button>
        </section>

        <section id="step-4" class="step-panel max-w-4xl mx-auto">
            <h2 class="text-5xl font-extrabold text-slate-900 mb-10">Tech Check</h2>
            <textarea id="dataText" class="w-full p-4 border rounded-xl mb-4" placeholder="Training Data..."></textarea>
            <textarea id="safetyText" class="w-full p-4 border rounded-xl" placeholder="Safety Rule..."></textarea>
            <button onclick="launchPitch()" class="mt-8 bg-blue-600 text-white px-10 py-4 rounded-2xl font-bold">Launch 🚀</button>
        </section>

        <section id="step-5" class="step-panel max-w-5xl mx-auto">
            <h2 class="text-6xl font-black text-slate-900 mb-8">The Pitch</h2>
            <div id="pitchResult" class="bg-white p-12 rounded-3xl shadow-2xl text-2xl italic"></div>
            <button onclick="window.print()" class="mt-8 bg-slate-900 text-white px-10 py-4 rounded-2xl font-bold">Print Pitch Deck</button>
        </section>
    </main>

    <script>
        const panels = document.querySelectorAll('.step-panel');
        function showStep(n) {
            panels.forEach(p => p.classList.remove('active'));
            document.getElementById(`step-${n}`).classList.add('active');
            if(n === 3) initCanvas();
        }

        let canvas, ctx, drawing = false;
        function initCanvas() {
            canvas = document.getElementById('drawCanvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 5;
            
            const getPos = (e) => {
                const r = canvas.getBoundingClientRect();
                const ev = e.touches ? e.touches[0] : e;
                return { x: ev.clientX - r.left, y: ev.clientY - r.top };
            };
            canvas.onmousedown = (e) => { drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
            canvas.onmousemove = (e) => { if(!drawing) return; const p = getPos(e); ctx.strokeStyle = document.getElementById('penColor').value; ctx.lineTo(p.x, p.y); ctx.stroke(); };
            window.onmouseup = () => { drawing = false; };
        }
        function clearCanvas() { ctx.clearRect(0,0,canvas.width, canvas.height); }

        function launchPitch() {
            const company = document.getElementById('companyName').value || "Our Startup";
            const prob = document.getElementById('problemText').value || "a big problem";
            const sol = document.getElementById('solutionText').value || "AI tech";
            const safe = document.getElementById('safetyText').value || "be safe";
            document.getElementById('pitchResult').innerHTML = `
                "Hello! We are <b>${company}</b>. We saw that <b>${prob}</b> is a problem. 
                Our AI solves it by <b>${sol}</b>. Our golden rule is: <b>${safe}</b>."
            `;
            showStep(5);
        }
    </script>
</body>
</html>
